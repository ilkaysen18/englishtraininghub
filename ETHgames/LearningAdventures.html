<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Adventures! 🎮</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', cursive;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 20px;
            animation: bounceIn 1s;
        }

        .header h1 {
            font-size: 3em;
            text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.3);
            margin-bottom: 10px;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .game-card {
            background: white;
            border-radius: 25px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .game-card:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .game-icon {
            font-size: 5em;
            margin-bottom: 10px;
            animation: float 3s ease-in-out infinite;
        }

        .game-title {
            font-size: 1.4em;
            color: #667eea;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .play-button {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 1.8em;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4);
            margin-top: 10px;
        }

        .play-button:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(245, 87, 108, 0.6);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            animation: fadeIn 0.3s;
        }

        .modal-content {
            background: white;
            margin: 30px auto;
            padding: 30px;
            border-radius: 25px;
            max-width: 900px;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            animation: slideDown 0.5s;
        }

        .close-button {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 3em;
            cursor: pointer;
            color: #666;
            transition: color 0.3s;
            background: #ffe6e6;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .close-button:hover {
            color: #f5576c;
            background: #ffcccc;
            transform: scale(1.1);
        }

        /* Simple number buttons */
        .number-button {
            font-size: 3em;
            padding: 20px;
            margin: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            min-width: 100px;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .number-button:hover {
            transform: scale(1.15);
        }

        .number-button:active {
            transform: scale(0.95);
        }

        .math-question {
            font-size: 4em;
            color: #667eea;
            margin: 30px 0;
            padding: 30px;
            background: #f0f0f0;
            border-radius: 20px;
            font-weight: bold;
        }

        .big-emoji {
            font-size: 5em;
            margin: 20px 0;
            animation: bounce 1s infinite;
        }

        .feedback {
            font-size: 3em;
            margin: 20px 0;
            min-height: 80px;
            font-weight: bold;
        }

        .points-display {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            padding: 15px 25px;
            border-radius: 50px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            font-size: 2em;
            color: #667eea;
            font-weight: bold;
            z-index: 999;
        }

        /* Picture buttons for words */
        .picture-option {
            display: inline-block;
            margin: 15px;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .picture-option:hover {
            transform: scale(1.1);
        }

        .picture-box {
            width: 150px;
            height: 150px;
            background: white;
            border: 5px solid #667eea;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 4em;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .picture-label {
            font-size: 1.2em;
            margin-top: 10px;
            color: #667eea;
            font-weight: bold;
        }

        /* Color boxes - bigger and simpler */
        .color-grid {
            display: grid;
            grid-template-columns: repeat(2, 150px);
            gap: 20px;
            justify-content: center;
            margin: 30px auto;
        }

        .color-box {
            width: 150px;
            height: 150px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            border: 5px solid white;
        }

        .color-box:hover {
            transform: scale(1.15);
        }

        /* Drawing canvas - simpler tools */
        .color-picker {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .color-picker button {
            width: 70px;
            height: 70px;
            border: 4px solid white;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .color-picker button:hover {
            transform: scale(1.2);
        }

        .color-picker button.active {
            border-color: #000;
            border-width: 6px;
        }

        @keyframes bounceIn {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideDown {
            from {
                transform: translateY(-100px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-15px);
            }
        }

        .instruction-text {
            font-size: 2em;
            color: #667eea;
            margin: 20px 0;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }
            
            .game-grid {
                grid-template-columns: 1fr;
            }

            .modal-content {
                margin: 10px;
                padding: 20px;
            }

            .number-button {
                font-size: 2.5em;
                padding: 15px;
                min-width: 80px;
            }

            .picture-box {
                width: 120px;
                height: 120px;
                font-size: 3em;
            }

            .color-box {
                width: 120px;
                height: 120px;
            }

            .color-grid {
                grid-template-columns: repeat(2, 120px);
            }
        }
    </style>
</head>
<body>
    <div class="points-display">
        ⭐ <span id="totalPoints">0</span>
    </div>

    <div class="container">
        <div class="header">
            <h1>🎮 Let's Play! 🎨</h1>
        </div>

        <div class="game-grid">
            <!-- Simple Math -->
            <div class="game-card" onclick="startSimpleMath()">
                <div class="game-icon">🔢</div>
                <div class="game-title">Count!</div>
                <button class="play-button">👆</button>
            </div>

            <!-- Picture Match -->
            <div class="game-card" onclick="startPictureMatch()">
                <div class="game-icon">🐶</div>
                <div class="game-title">Find!</div>
                <button class="play-button">👆</button>
            </div>

            <!-- Color Match -->
            <div class="game-card" onclick="startColorMatch()">
                <div class="game-icon">🎨</div>
                <div class="game-title">Colors!</div>
                <button class="play-button">👆</button>
            </div>

            <!-- Draw -->
            <div class="game-card" onclick="startSimpleDrawing()">
                <div class="game-icon">✏️</div>
                <div class="game-title">Draw!</div>
                <button class="play-button">👆</button>
            </div>

            <!-- Shapes -->
            <div class="game-card" onclick="startShapes()">
                <div class="game-icon">🔷</div>
                <div class="game-title">Shapes!</div>
                <button class="play-button">👆</button>
            </div>

            <!-- Music -->
            <div class="game-card" onclick="startMusic()">
                <div class="game-icon">🎵</div>
                <div class="game-title">Music!</div>
                <button class="play-button">👆</button>
            </div>
        </div>
    </div>

    <div id="gameModal" class="modal">
        <div class="modal-content">
            <span class="close-button" onclick="closeModal()">✖</span>
            <div id="gameArea"></div>
        </div>
    </div>

    <script>
        let totalPoints = 0;

        function updatePoints(points) {
            totalPoints += points;
            document.getElementById('totalPoints').innerText = totalPoints;
            
            const pointsDisplay = document.querySelector('.points-display');
            pointsDisplay.style.transform = 'scale(1.3)';
            setTimeout(() => {
                pointsDisplay.style.transform = 'scale(1)';
            }, 300);
            
            playSound('success');
        }

        function closeModal() {
            document.getElementById('gameModal').style.display = 'none';
        }

        function playSound(type) {
            // Sound feedback (visual instead since we can't use audio)
            if (type === 'success') {
                console.log('🎉');
            }
        }

        // SIMPLE MATH GAME - Visual counting
        let currentMathAnswer = 0;

        function startSimpleMath() {
            document.getElementById('gameModal').style.display = 'block';
            generateSimpleMath();
        }

        function generateSimpleMath() {
            const num1 = Math.floor(Math.random() * 5) + 1;
            const num2 = Math.floor(Math.random() * 5) + 1;
            currentMathAnswer = num1 + num2;

            // Create visual dots
            let dots1 = '';
            let dots2 = '';
            for(let i = 0; i < num1; i++) {
                dots1 += '🔵 ';
            }
            for(let i = 0; i < num2; i++) {
                dots2 += '🔴 ';
            }

            document.getElementById('gameArea').innerHTML = `
                <div style="text-align: center;">
                    <div class="big-emoji">🔢</div>
                    <div class="instruction-text">Count all!</div>
                    
                    <div style="font-size: 3em; margin: 30px 0; background: #f0f0f0; padding: 30px; border-radius: 20px;">
                        ${dots1}
                        <br><br>
                        ➕
                        <br><br>
                        ${dots2}
                    </div>

                    <div class="instruction-text">How many?</div>
                    
                    <div style="margin: 20px 0;">
                        ${generateNumberButtons(1, 10)}
                    </div>

                    <div class="feedback" id="mathFeedback"></div>
                </div>
            `;
        }

        function generateNumberButtons(start, end) {
            let buttons = '';
            for(let i = start; i <= end; i++) {
                buttons += `<button class="number-button" onclick="checkSimpleMath(${i})">${i}</button>`;
            }
            return buttons;
        }

        function checkSimpleMath(answer) {
            const feedback = document.getElementById('mathFeedback');
            
            if(answer === currentMathAnswer) {
                feedback.innerHTML = '🎉<br>Yes!';
                feedback.style.color = '#4CAF50';
                updatePoints(10);
                
                setTimeout(() => {
                    generateSimpleMath();
                }, 2000);
            } else {
                feedback.innerHTML = '❌<br>Try again!';
                feedback.style.color = '#f5576c';
            }
        }

        // PICTURE MATCH GAME
        const animals = [
            {emoji: '🐶', name: 'Dog', sound: 'Woof!'},
            {emoji: '🐱', name: 'Cat', sound: 'Meow!'},
            {emoji: '🐮', name: 'Cow', sound: 'Moo!'},
            {emoji: '🐷', name: 'Pig', sound: 'Oink!'},
            {emoji: '🐸', name: 'Frog', sound: 'Ribbit!'},
            {emoji: '🦁', name: 'Lion', sound: 'Roar!'}
        ];

        function startPictureMatch() {
            document.getElementById('gameModal').style.display = 'block';
            const correct = animals[Math.floor(Math.random() * animals.length)];
            const options = [correct];
            
            // Add 2 wrong options
            while(options.length < 3) {
                const random = animals[Math.floor(Math.random() * animals.length)];
                if(!options.includes(random)) {
                    options.push(random);
                }
            }
            
            // Shuffle
            options.sort(() => Math.random() - 0.5);

            let optionsHTML = '';
            options.forEach(animal => {
                optionsHTML += `
                    <div class="picture-option" onclick="checkAnimal('${animal.emoji}', '${correct.emoji}')">
                        <div class="picture-box">${animal.emoji}</div>
                    </div>
                `;
            });

            document.getElementById('gameArea').innerHTML = `
                <div style="text-align: center;">
                    <div class="big-emoji">🐶</div>
                    <div class="instruction-text">Find the ${correct.name}!</div>
                    <div style="font-size: 3em; margin: 20px 0;">${correct.sound}</div>
                    
                    <div style="margin: 30px 0;">
                        ${optionsHTML}
                    </div>

                    <div class="feedback" id="pictureFeedback"></div>
                </div>
            `;
        }

        function checkAnimal(selected, correct) {
            const feedback = document.getElementById('pictureFeedback');
            
            if(selected === correct) {
                feedback.innerHTML = '🎉<br>Great!';
                feedback.style.color = '#4CAF50';
                updatePoints(10);
                
                setTimeout(() => {
                    startPictureMatch();
                }, 2000);
            } else {
                feedback.innerHTML = '❌<br>Try again!';
                feedback.style.color = '#f5576c';
            }
        }

        // COLOR MATCH GAME
        const colors = [
            {name: 'Red', color: '#FF6B6B', emoji: '🔴'},
            {name: 'Blue', color: '#4ECDC4', emoji: '🔵'},
            {name: 'Yellow', color: '#F7DC6F', emoji: '🟡'},
            {name: 'Green', color: '#98D8C8', emoji: '🟢'}
        ];

        function startColorMatch() {
            document.getElementById('gameModal').style.display = 'block';
            const correct = colors[Math.floor(Math.random() * colors.length)];
            
            let optionsHTML = '';
            colors.forEach(color => {
                optionsHTML += `
                    <div class="color-box" style="background: ${color.color};" onclick="checkColor('${color.name}', '${correct.name}')"></div>
                `;
            });

            document.getElementById('gameArea').innerHTML = `
                <div style="text-align: center;">
                    <div class="big-emoji">🎨</div>
                    <div class="instruction-text">Find ${correct.name}!</div>
                    <div style="font-size: 5em; margin: 20px 0;">${correct.emoji}</div>
                    
                    <div class="color-grid">
                        ${optionsHTML}
                    </div>

                    <div class="feedback" id="colorFeedback"></div>
                </div>
            `;
        }

        function checkColor(selected, correct) {
            const feedback = document.getElementById('colorFeedback');
            
            if(selected === correct) {
                feedback.innerHTML = '🎉<br>Perfect!';
                feedback.style.color = '#4CAF50';
                updatePoints(10);
                
                setTimeout(() => {
                    startColorMatch();
                }, 2000);
            } else {
                feedback.innerHTML = '❌<br>Try again!';
                feedback.style.color = '#f5576c';
            }
        }

        // SIMPLE DRAWING
        let canvas, ctx, isDrawing = false;
        let currentColor = '#000000';

        function startSimpleDrawing() {
            document.getElementById('gameModal').style.display = 'block';
            
            const colorButtons = [
                {color: '#FF6B6B', emoji: '❤️'},
                {color: '#FFA07A', emoji: '🧡'},
                {color: '#F7DC6F', emoji: '💛'},
                {color: '#98D8C8', emoji: '💚'},
                {color: '#4ECDC4', emoji: '💙'},
                {color: '#DDA0DD', emoji: '💜'},
                {color: '#8B4513', emoji: '🤎'},
                {color: '#000000', emoji: '🖤'}
            ];

            let colorsHTML = '';
            colorButtons.forEach((c, i) => {
                colorsHTML += `<button onclick="changeDrawColor('${c.color}', ${i})" style="background: ${c.color};" id="colorBtn${i}">${c.emoji}</button>`;
            });

            document.getElementById('gameArea').innerHTML = `
                <div style="text-align: center;">
                    <div class="big-emoji">✏️</div>
                    <div class="instruction-text">Draw here!</div>
                    
                    <div class="color-picker">
                        ${colorsHTML}
                        <button onclick="clearDrawing()" style="background: white; border: 4px solid #666;">🗑️</button>
                    </div>

                    <canvas id="drawingCanvas" width="700" height="500" style="border: 5px solid #667eea; border-radius: 20px; cursor: crosshair; background: white; max-width: 100%; touch-action: none;"></canvas>
                    
                    <br><br>
                    <button class="number-button" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);" onclick="saveDrawing()">❤️ Love it!</button>
                </div>
            `;
            
            initDrawing();
            document.getElementById('colorBtn0').classList.add('active');
        }

        function initDrawing() {
            canvas = document.getElementById('drawingCanvas');
            ctx = canvas.getContext('2d');
            ctx.lineWidth = 8;
            ctx.lineCap = 'round';
            ctx.strokeStyle = currentColor;

            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', drawLine);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseout', stopDrawing);

            canvas.addEventListener('touchstart', handleDrawTouch);
            canvas.addEventListener('touchmove', handleDrawTouch);
            canvas.addEventListener('touchend', stopDrawing);
        }

        function startDrawing(e) {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            ctx.beginPath();
            ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        }

        function drawLine(e) {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
            ctx.stroke();
        }

        function stopDrawing() {
            isDrawing = false;
        }

        function handleDrawTouch(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            
            if(e.type === 'touchstart') {
                isDrawing = true;
                ctx.beginPath();
                ctx.moveTo(touch.clientX - rect.left, touch.clientY - rect.top);
            } else if(e.type === 'touchmove' && isDrawing) {
                ctx.lineTo(touch.clientX - rect.left, touch.clientY - rect.top);
                ctx.stroke();
            }
        }

        function changeDrawColor(color, index) {
            currentColor = color;
            ctx.strokeStyle = color;
            
            // Update active button
            document.querySelectorAll('.color-picker button').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById('colorBtn' + index).classList.add('active');
        }

        function clearDrawing() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function saveDrawing() {
            updatePoints(25);
            const feedback = document.createElement('div');
            feedback.innerHTML = '🎨 Beautiful! +25 ⭐';
            feedback.style.cssText = 'position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 40px; border-radius: 30px; font-size: 3em; box-shadow: 0 10px 40px rgba(0,0,0,0.3); z-index: 10000;';
            document.body.appendChild(feedback);
            
            setTimeout(() => {
                feedback.remove();
            }, 2000);
        }

        // SHAPES GAME
        const shapes = [
            {name: 'Circle', emoji: '⭕', shape: 'circle'},
            {name: 'Square', emoji: '🟦', shape: 'square'},
            {name: 'Triangle', emoji: '🔺', shape: 'triangle'},
            {name: 'Star', emoji: '⭐', shape: 'star'}
        ];

        function startShapes() {
            document.getElementById('gameModal').style.display = 'block';
            const correct = shapes[Math.floor(Math.random() * shapes.length)];
            
            let optionsHTML = '';
            shapes.forEach(shape => {
                optionsHTML += `
                    <div class="picture-option" onclick="checkShape('${shape.name}', '${correct.name}')">
                        <div class="picture-box">${shape.emoji}</div>
                        <div class="picture-label">${shape.name}</div>
                    </div>
                `;
            });

            document.getElementById('gameArea').innerHTML = `
                <div style="text-align: center;">
                    <div class="big-emoji">🔷</div>
                    <div class="instruction-text">Find the ${correct.name}!</div>
                    
                    <div style="margin: 30px 0;">
                        ${optionsHTML}
                    </div>

                    <div class="feedback" id="shapeFeedback"></div>
                </div>
            `;
        }

        function checkShape(selected, correct) {
            const feedback = document.getElementById('shapeFeedback');
            
            if(selected === correct) {
                feedback.innerHTML = '🎉<br>Yes!';
                feedback.style.color = '#4CAF50';
                updatePoints(10);
                
                setTimeout(() => {
                    startShapes();
                }, 2000);
            } else {
                feedback.innerHTML = '❌<br>Try again!';
                feedback.style.color = '#f5576c';
            }
        }

        // MUSIC GAME - Simple instrument sounds
        function startMusic() {
            document.getElementById('gameModal').style.display = 'block';
            
            const instruments = [
                {emoji: '🥁', name: 'Drum', sound: 'Boom Boom!'},
                {emoji: '🎹', name: 'Piano', sound: 'Ding Ding!'},
                {emoji: '🎸', name: 'Guitar', sound: 'Strum Strum!'},
                {emoji: '🎺', name: 'Trumpet', sound: 'Toot Toot!'},
                {emoji: '🎻', name: 'Violin', sound: 'La La!'},
                {emoji: '🪘', name: 'Tambourine', sound: 'Shake Shake!'}
            ];

            let instrumentsHTML = '';
            instruments.forEach(inst => {
                instrumentsHTML += `
                    <div class="picture-option" onclick="playInstrument('${inst.sound}', '${inst.emoji}')">
                        <div class="picture-box">${inst.emoji}</div>
                        <div class="picture-label">${inst.name}</div>
                    </div>
                `;
            });

            document.getElementById('gameArea').innerHTML = `
                <div style="text-align: center;">
                    <div class="big-emoji">🎵</div>
                    <div class="instruction-text">Make Music!</div>
                    
                    <div style="margin: 30px 0;">
                        ${instrumentsHTML}
                    </div>

                    <div class="feedback" id="musicFeedback" style="min-height: 100px;"></div>
                </div>
            `;
        }

        function playInstrument(sound, emoji) {
            const feedback = document.getElementById('musicFeedback');
            feedback.innerHTML = `<div style="font-size: 4em;">${emoji}</div><div style="font-size: 2.5em;">${sound}</div>`;
            feedback.style.color = '#667eea';
            updatePoints(5);
            
            // Animate
            feedback.style.transform = 'scale(1.2)';
            setTimeout(() => {
                feedback.style.transform = 'scale(1)';
            }, 300);
        }

        window.onclick = function(event) {
            const modal = document.getElementById('gameModal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        }
    </script>
</body>
</html>
