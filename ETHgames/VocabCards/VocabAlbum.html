<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Vocabulary Album</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Kalam:wght@400;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg-from: #1565C0;
            --bg-via: #26C6DA;
            --bg-to: #FFD600;
            --page-bg: #FFF9EE;
            --page-line: #cde0f5;
            --page-margin: #e8a0a0;
            --text-dark: #263238;
            --text-mid: #546E7A;
            --text-light: #90A4AE;
            --accent-blue: #1565C0;
            --accent-sky: #039BE5;
            --accent-gold: #FFB300;
            --accent-sun: #FFD600;
            --accent-coral: #FF7043;
            --chip-a: linear-gradient(135deg, #1565C0, #0288D1);
            --chip-b: linear-gradient(135deg, #FFB300, #FF8F00);
            --shadow-page: 3px 4px 18px rgba(21,101,192,0.13), 0 1px 4px rgba(0,0,0,0.07);
            --shadow-flip: 8px 0 32px rgba(0,0,0,0.18);
        }
        .dark {
            --page-bg: #1E1B16;
            --page-line: #32302B;
            --page-margin: #5C3A3A;
            --text-dark: #ECE0D1;
            --text-mid: #A89B8C;
            --text-light: #6D6358;
            --accent-blue: #42A5F5;
            --accent-sky: #4FC3F7;
            --shadow-page: 3px 4px 18px rgba(0,0,0,0.35), 0 1px 4px rgba(0,0,0,0.2);
            --shadow-flip: 8px 0 32px rgba(0,0,0,0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; }

        body {
            font-family: 'Outfit', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            padding: 14px;
            background: linear-gradient(140deg, var(--bg-from) 0%, var(--bg-via) 42%, var(--bg-to) 100%);
            background-size: 300% 300%;
            animation: bgPulse 18s ease-in-out infinite;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 50% at 15% 20%, rgba(255,214,0,0.18) 0%, transparent 70%),
                radial-gradient(ellipse 50% 60% at 85% 75%, rgba(21,101,192,0.15) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        .dark body { background: linear-gradient(140deg, #0D47A1 0%, #004D40 42%, #F57F17 100%); }

        @keyframes bgPulse {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* ─── Header ─── */
        .header {
            text-align: center;
            margin-bottom: 12px;
            z-index: 5;
            position: relative;
        }
        .header h1 {
            font-family: 'Lilita One', cursive;
            font-size: clamp(1.35rem, 4.5vw, 2.3rem);
            color: #fff;
            text-shadow: 0 2px 12px rgba(21,101,192,0.35), 0 0 40px rgba(255,214,0,0.22);
            letter-spacing: 0.5px;
        }
        .header .sub {
            font-family: 'Kalam', cursive;
            color: rgba(255,255,255,0.82);
            font-size: clamp(0.82rem, 2.4vw, 1.05rem);
            margin-top: 2px;
        }

        /* ─── Book Scene ─── */
        .book-scene {
            perspective: 2000px;
            width: min(92vw, 480px);
            height: min(62dvh, 590px);
            position: relative;
            z-index: 2;
        }
        .book {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
        }

        /* ─── Page ─── */
        .page {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-origin: left center;
            transition: transform 0.85s cubic-bezier(0.40, 0.0, 0.15, 1.0),
                        box-shadow 0.85s ease;
            backface-visibility: hidden;
            border-radius: 3px 14px 14px 3px;
            overflow: hidden;
            box-shadow: var(--shadow-page);
            will-change: transform;
        }
        .page.flipped {
            transform: rotateY(-180deg);
            box-shadow: none;
        }
        .page.flipping {
            box-shadow: var(--shadow-flip);
        }

        /* Page inner */
        .pg {
            width: 100%;
            height: 100%;
            background: var(--page-bg);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* Notebook ruled lines */
        .pg::after {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                transparent, transparent 29px,
                var(--page-line) 29px, var(--page-line) 30px
            );
            opacity: 0.45;
            pointer-events: none;
            z-index: 0;
        }
        /* Red margin line */
        .pg::before {
            content: '';
            position: absolute;
            top: 0; left: 38px;
            width: 2px; height: 100%;
            background: var(--page-margin);
            opacity: 0.32;
            z-index: 1;
        }

        /* Page edge texture (visible stack) */
        .page:not(.flipped)::after {
            content: '';
            position: absolute;
            top: 6px; bottom: 6px; right: -2px;
            width: 5px;
            background: repeating-linear-gradient(
                to bottom,
                rgba(200,200,200,0.3) 0px, rgba(200,200,200,0.3) 1px,
                transparent 1px, transparent 4px
            );
            border-radius: 0 2px 2px 0;
            z-index: 3;
        }

        /* ─── Cover ─── */
        .cover-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 28px 24px;
            position: relative;
            z-index: 2;
        }
        .cover-badge {
            width: 88px; height: 88px;
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-sun));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.6rem;
            box-shadow: 0 4px 20px rgba(255,179,0,0.35);
            margin-bottom: 18px;
            animation: badgePop 2.5s ease infinite;
        }
        @keyframes badgePop {
            0%, 100% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.06) rotate(-3deg); }
            75% { transform: scale(1.03) rotate(2deg); }
        }
        .cover-wrap h2 {
            font-family: 'Lilita One', cursive;
            font-size: clamp(1.4rem, 4.5vw, 2rem);
            color: var(--accent-blue);
            line-height: 1.2;
            margin-bottom: 6px;
        }
        .cover-wrap .tagline {
            font-family: 'Kalam', cursive;
            color: var(--text-mid);
            font-size: 1rem;
        }
        .cover-wrap .hint {
            position: absolute;
            bottom: 28px;
            font-family: 'Kalam', cursive;
            color: var(--text-light);
            font-size: 0.82rem;
        }
        .cover-wrap .hint i { margin-left: 4px; animation: nudge 1.5s ease infinite; }
        @keyframes nudge {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(5px); }
        }

        /* ─── Vocab Page ─── */
        .vocab-head {
            padding: 14px 18px 8px 50px;
            position: relative;
            z-index: 2;
        }
        .vocab-head h3 {
            font-family: 'Lilita One', cursive;
            font-size: clamp(1.05rem, 3vw, 1.4rem);
            color: var(--accent-blue);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .vocab-head h3 .v-emoji { font-style: normal; }

        .frame-zone {
            flex: 1;
            min-height: 0;
            margin: 0 16px 10px 16px;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            z-index: 2;
            border: 3px dashed var(--accent-gold);
            background: rgba(255,179,0,0.06);
        }
        .dark .frame-zone {
            border-color: #8D6E1A;
            background: rgba(255,179,0,0.04);
        }
        .frame-zone iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        .frame-ph {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 18px;
            gap: 8px;
        }
        .frame-ph .ph-icon {
            font-size: 2.6rem;
            color: var(--accent-gold);
            opacity: 0.7;
        }
        .frame-ph .ph-label {
            font-family: 'Kalam', cursive;
            color: var(--text-mid);
            font-size: 0.95rem;
        }
        .frame-ph .ph-hint {
            font-size: 0.72rem;
            color: var(--text-light);
            max-width: 240px;
            line-height: 1.4;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            padding: 0 18px 14px 50px;
            position: relative;
            z-index: 2;
        }
        .chip {
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.4px;
            color: #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.12);
        }
        .chip-a { background: var(--chip-a); }
        .chip-b { background: var(--chip-b); color: var(--text-dark); }

        /* Floating sticker */
        .stk {
            position: absolute;
            font-size: 1.6rem;
            opacity: 0.12;
            z-index: 1;
            pointer-events: none;
        }

        /* Page # */
        .pg-num {
            position: absolute;
            bottom: 8px; right: 14px;
            font-family: 'Kalam', cursive;
            font-size: 0.78rem;
            color: var(--text-light);
            z-index: 2;
        }

        /* ─── Back Cover ─── */
        .back-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 28px;
            position: relative;
            z-index: 2;
            gap: 10px;
        }
        .back-wrap .trophy { font-size: 3.4rem; }
        .back-wrap h2 {
            font-family: 'Lilita One', cursive;
            font-size: 1.5rem;
            color: var(--accent-coral);
        }
        .back-wrap p {
            font-family: 'Kalam', cursive;
            color: var(--text-mid);
            font-size: 0.95rem;
        }
        .back-wrap .stars {
            font-size: 1.6rem;
            letter-spacing: 4px;
        }
        .back-wrap .credit {
            margin-top: 14px;
            padding: 10px 18px;
            background: linear-gradient(135deg, rgba(21,101,192,0.08), rgba(255,179,0,0.10));
            border-radius: 12px;
            border: 1px dashed var(--accent-gold);
        }
        .dark .back-wrap .credit {
            background: linear-gradient(135deg, rgba(66,165,245,0.08), rgba(255,179,0,0.06));
            border-color: #8D6E1A;
        }
        .back-wrap .credit a {
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 0.82rem;
            color: var(--accent-blue);
            text-decoration: none;
            word-break: break-all;
        }
        .back-wrap .credit a:hover { text-decoration: underline; }
        .back-wrap .credit .by {
            font-family: 'Kalam', cursive;
            font-size: 0.85rem;
            color: var(--text-mid);
            margin-top: 4px;
        }

        /* ─── Navigation ─── */
        .nav {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-top: 16px;
            z-index: 5;
            position: relative;
        }
        .nav-btn {
            width: 48px; height: 48px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.35);
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #fff;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nav-btn:hover:not(:disabled) {
            background: rgba(255,255,255,0.3);
            transform: scale(1.08);
            border-color: rgba(255,255,255,0.55);
        }
        .nav-btn:active:not(:disabled) { transform: scale(0.96); }
        .nav-btn:disabled { opacity: 0.25; cursor: not-allowed; }

        .pg-info {
            font-family: 'Lilita One', cursive;
            color: #fff;
            font-size: 0.95rem;
            text-shadow: 0 1px 6px rgba(0,0,0,0.25);
            min-width: 72px;
            text-align: center;
        }

        /* ─── Tap Zones ─── */
        .tap { position: absolute; top: 0; width: 22%; height: 100%; z-index: 8; cursor: pointer; }
        .tap-l { left: 0; border-radius: 3px 0 0 3px; }
        .tap-r { right: 0; border-radius: 0 14px 14px 0; }
        .tap:active { background: rgba(255,255,255,0.06); }

        /* ─── Responsive ─── */
        @media (max-width: 500px) {
            body { padding: 10px; }
            .header { margin-bottom: 8px; }
            .book-scene { width: 97vw; height: 58dvh; }
            .pg::before { left: 26px; }
            .vocab-head { padding-left: 36px; }
            .chips { padding-left: 36px; }
            .nav { margin-top: 12px; gap: 12px; }
            .nav-btn { width: 42px; height: 42px; font-size: 1rem; }
            .cover-badge { width: 72px; height: 72px; font-size: 2.2rem; }
        }
        @media (min-width: 501px) and (max-width: 820px) {
            .book-scene { width: min(85vw, 500px); height: min(64dvh, 610px); }
        }
        @media (min-width: 821px) {
            .book-scene { width: 480px; height: 600px; }
        }
        @media (min-height: 900px) {
            .book-scene { height: min(68dvh, 680px); }
        }
    </style>
</head>
<body>

<div class="header">
    <h1>&#x1F4D6; English Vocabulary Album</h1>
    <p class="sub">Flip through the pages &amp; learn new words!</p>
</div>

<div class="book-scene" id="bookScene">
    <div class="book" id="book"></div>

</div>

<div class="nav">

        <i class="fas fa-chevron-left"></i>

    <div class="pg-info" id="pgInfo">1 / 12</div>

        <i class="fas fa-chevron-right"></i>

</div>

<script>
/* ─── Dark Mode ─── */
(function(){
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.classList.add('dark');
    }
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
        if (e.matches) { document.documentElement.classList.add('dark'); }
        else { document.documentElement.classList.remove('dark'); }
    });
})();

/* ═══════════════════════════════════════════

        driveId: "",
        words: ["Sunny","Rainy","Cloudy","Windy","Snowy","Stormy"],
        stickers: ["\u2600\uFE0F","\uD83C\uDF27\uFE0F","\u2744\uFE0F"]
    },

        words: ["Shirt","Pants","Shoes","Hat","Jacket","Dress"],

    },

var book = document.getElementById("book");
var btnPrev = document.getElementById("btnPrev");
var btnNext = document.getElementById("btnNext");
var pgInfo = document.getElementById("pgInfo");
var tapL = document.getElementById("tapL");
var tapR = document.getElementById("tapR");

var current = 0;
var total = PAGES.length;
var animating = false;

/* ─── Build Pages ─── */
function buildPages() {
    var stickerPositions = [
        "top:12%;right:6%",
        "bottom:22%;right:4%",
        "top:50%;right:2%"
    ];

    PAGES.forEach(function(d, idx) {
        var el = document.createElement("div");
        el.className = "page";
        el.style.zIndex = total - idx;

        var html = '<div class="pg">';

        if (d.type === "cover") {
            html += '<div class="cover-wrap">' +
                '<div class="cover-badge">\uD83D\uDCD6</div>' +
                '<h2>My English<br>Vocabulary Album</h2>' +
                '<p class="tagline">Learn new words every day!</p>' +
                '<p class="hint">Tap or swipe to flip <i class="fas fa-arrow-right"></i></p>' +
            '</div>';
        } else if (d.type === "back") {
            html += '<div class="back-wrap">' +
                '<div class="trophy">\uD83C\uDFC6</div>' +
                '<h2>Great Job!</h2>' +
                '<p>You reviewed all the vocabulary!</p>' +
                '<div class="stars">\u2B50\u2B50\u2B50\u2B50\u2B50</div>' +
                '<p>Keep learning every day!</p>' +
                '<div class="credit">' +
                    '<a href="https://pin.it/4ozkGtPGv" target="_blank" rel="noopener noreferrer">' +
                        '<i class="fab fa-pinterest"></i> pin.it/4ozkGtPGv' +
                    '</a>' +
                    '<p class="by">Find more content like this on Pinterest!<br>by tommyflashcards</p>' +
                '</div>' +
            '</div>';
        } else {
            html += '<div class="vocab-head"><h3>' +
                '<span class="v-emoji">' + d.emoji + '</span> ' + d.title +
            '</h3></div>';

            html += '<div class="frame-zone">';
            if (d.driveId) {
                html += '<iframe src="https://drive.google.com/file/d/' +
                    d.driveId + '/preview" allow="autoplay" loading="lazy"></iframe>';
            } else {
                html += '<div class="frame-ph">' +
                    '<div class="ph-icon"><i class="fas fa-images"></i></div>' +
                    '<div class="ph-label">' + d.title + ' Vocabulary</div>' +
                    '<div class="ph-hint">Add your Google Drive file ID in the driveId field in the code to display vocabulary images here.</div>' +
                '</div>';
            }
            html += '</div>';

            html += '<div class="chips">';
            d.words.forEach(function(w, wi) {
                html += '<span class="chip ' + (wi % 2 === 0 ? 'chip-a' : 'chip-b') + '">' + w + '</span>';
            });
            html += '</div>';

            if (d.stickers) {
                d.stickers.forEach(function(s, si) {
                    html += '<span class="stk" style="' + (stickerPositions[si] || "") + '">' + s + '</span>';
                });
            }
        }

        if (idx > 0 && idx < total - 1) {
            html += '<span class="pg-num">' + idx + '</span>';
        }

        html += '</div>';
        el.innerHTML = html;
        book.appendChild(el);
    });
}

/* ─── Navigation Logic ─── */
function syncNav() {
    btnPrev.disabled = current === 0;
    btnNext.disabled = current === total - 1;
    pgInfo.textContent = (current + 1) + " / " + total;
}

function reindex() {
    var pages = book.querySelectorAll(".page");
    for (var i = 0; i < pages.length; i++) {
        pages[i].style.zIndex = i < current ? i : total - i;
    }
}

function flipNext() {
    if (current >= total - 1 || animating) return;
    animating = true;
    var pages = book.querySelectorAll(".page");
    var pg = pages[current];
    pg.classList.add("flipping");
    pg.style.zIndex = total + 1;
    pg.classList.add("flipped");
    current++;
    syncNav();
    setTimeout(function() {
        pg.classList.remove("flipping");
        reindex();
        animating = false;
    }, 880);
}

function flipPrev() {
    if (current <= 0 || animating) return;
    animating = true;
    current--;
    var pages = book.querySelectorAll(".page");
    var pg = pages[current];
    pg.classList.add("flipping");
    pg.style.zIndex = total + 1;
    pg.classList.remove("flipped");
    syncNav();
    setTimeout(function() {
        pg.classList.remove("flipping");
        reindex();
        animating = false;
    }, 880);
}

/* ─── Events ─── */
btnPrev.addEventListener("click", flipPrev);
btnNext.addEventListener("click", flipNext);
tapL.addEventListener("click", flipPrev);
tapR.addEventListener("click", flipNext);

/* Touch swipe */
var sx = 0;
var sy = 0;
var bookScene = document.getElementById("bookScene");

bookScene.addEventListener("touchstart", function(e) {
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
}, { passive: true });

bookScene.addEventListener("touchend", function(e) {
    var dx = e.changedTouches[0].clientX - sx;
    var dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 45) {
        if (dx < 0) { flipNext(); }
        else { flipPrev(); }
    }
}, { passive: true });

/* Keyboard */
document.addEventListener("keydown", function(e) {
    if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); flipNext(); }
    if (e.key === "ArrowLeft") { e.preventDefault(); flipPrev(); }
});

/* ─── Init ─── */
buildPages();
syncNav();
</script>
</body>
</html>
