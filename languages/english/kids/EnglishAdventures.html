<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kid Interactive Worksheets</title>
  <style>
    /* --- General Layout --- */
    body {
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background: #fdf6e3;
      margin: 0;
      padding: 0;
    }
    header {
      background: #ffb347;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 2rem;
      font-weight: bold;
    }
    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 10px;
    }

    /* --- Drag and Drop --- */
    .drag-drop-section {
      margin-bottom: 40px;
    }
    .drag-cards {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .drag-cards div {
      background: #ffe0b2;
      padding: 15px 20px;
      border-radius: 8px;
      cursor: grab;
      user-select: none;
    }
    .drop-targets {
      display: flex;
      gap: 10px;
    }
    .drop-targets div {
      flex: 1;
      min-height: 60px;
      background: #fff3e0;
      border: 2px dashed #ff9800;
      border-radius: 8px;
      text-align: center;
      line-height: 60px;
      font-weight: bold;
    }

    /* --- Tracing Letters --- */
    .trace-section {
      margin-bottom: 40px;
    }
    canvas {
      border: 2px dashed #ff9800;
      margin-top: 10px;
      touch-action: none;
    }

    /* --- CVC Words Reading --- */
    .cvc-section button {
      margin: 5px;
      padding: 10px 20px;
      font-size: 1.2rem;
      border: none;
      border-radius: 8px;
      background: #ffb347;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>🌟 English Adventures: Interactive Activities for Kids 🌟</header>
  <div class="container">
    
    <!-- Drag and Drop Section -->
    <section class="drag-drop-section">
      <h2>Match the Vocabulary</h2>
      <div class="drag-cards">
        <div draggable="true" class="drag-card" data-word="Cat">Cat</div>
        <div draggable="true" class="drag-card" data-word="Dog">Dog</div>
        <div draggable="true" class="drag-card" data-word="Sun">Sun</div>
      </div>
      <div class="drop-targets">
        <div data-word="Sun">Drop here for Sun</div>
        <div data-word="Dog">Drop here for Dog</div>
        <div data-word="Cat">Drop here for Cat</div>
      </div>
    </section>

    <!-- Trace Letters Section -->
    <section class="trace-section">
      <h2>Trace the Letters</h2>
      <p>Trace the word: <strong>CAT</strong></p>
      <canvas id="traceCanvas" width="600" height="150"></canvas>
    </section>

    <!-- CVC Words Reading Section -->
    <section class="cvc-section">
      <h2>Read CVC Words</h2>
      <button onclick="speak('cat')">Cat</button>
      <button onclick="speak('dog')">Dog</button>
      <button onclick="speak('sun')">Sun</button>
    </section>

  </div>

  <script>
    /* --- Drag and Drop JS --- */
    const dragCards = document.querySelectorAll('.drag-card');
    const dropTargets = document.querySelectorAll('.drop-targets div');

    dragCards.forEach(card => {
      card.addEventListener('dragstart', e => {
        e.dataTransfer.setData('text/plain', card.dataset.word);
      });
    });

    dropTargets.forEach(target => {
      target.addEventListener('dragover', e => e.preventDefault());
      target.addEventListener('drop', e => {
        e.preventDefault();
        const word = e.dataTransfer.getData('text/plain');
        if (word === target.dataset.word) {
          target.textContent = word + " ✅";
          const card = [...dragCards].find(c => c.dataset.word === word);
          card.style.display = 'none';
        } else {
          alert("Try again!");
        }
      });
    });

    /* --- Trace Letters JS --- */
    const canvas = document.getElementById('traceCanvas');
    const ctx = canvas.getContext('2d');
    ctx.font = 'bold 100px Arial';
    ctx.fillStyle = '#ffcc80';
    ctx.fillText('CAT', 50, 120);

    let drawing = false;
    canvas.addEventListener('pointerdown', () => drawing = true);
    canvas.addEventListener('pointerup', () => drawing = false);
    canvas.addEventListener('pointermove', e => {
      if (!drawing) return;
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.beginPath();
      ctx.arc(x, y, 8, 0, Math.PI * 2);
      ctx.fill();
    });

    /* --- CVC Words Speech --- */
    function speak(word) {
      const utterance = new SpeechSynthesisUtterance(word);
      utterance.rate = 0.8;
      speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
